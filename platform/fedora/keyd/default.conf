# keyd configuration: key remaps applied below the desktop, so they work in
# GNOME, Sway, the console, everywhere. Installed to /etc/keyd/default.conf
# by platform/fedora/bootstrap.sh.
#
# Reload after editing: run the bootstrap again, or `sudo keyd reload`.
# Escape hatch if a mapping makes the keyboard unusable: Backspace+Escape+Enter
# kills keyd.

# Which keyboards this applies to. * means all of them.
[ids]
*

# The main layer, active by default.
[main]
# Caps Lock does two jobs: held, it is Control; tapped alone, it is Escape.
# GNOME's own keyboard options cannot express tap-versus-hold, which is why
# keyd is here at all. The same remap in macOS is done in System Settings.
#
#   overload(<layer-or-modifier>, <key>)   hold = the first, tap = the second
capslock = overload(control, esc)
