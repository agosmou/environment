# Battery charge limits, applied at every boot by systemd-tmpfiles. Installed
# to /etc/tmpfiles.d/environment-battery.conf by platform/fedora/bootstrap.sh.
#
# Lithium batteries age fastest when kept at 100%. On a laptop that lives on
# the charger, stopping at 80% roughly doubles the battery's useful life.
# These are the two firmware knobs ThinkPads (and most laptops) expose; GNOME's
# "Preserve Battery Health" toggle writes the same values. On a machine
# without a battery the paths do not exist and the lines are skipped.
#
# Format: type  path  mode  user  group  age  argument
#   w  write the argument to the file
#   -  not applicable for a write
#
# Options for the argument: any percentage; end must be above start.
#   80 / 75  the GNOME preset; charging resumes below 75, stops at 80
#   60 / 55  for a laptop that never leaves the desk
#   100      full charge, the firmware default (delete this file instead)
w /sys/class/power_supply/BAT0/charge_control_end_threshold   - - - - 80
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 75
